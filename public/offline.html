<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Kelilingku - Tidak terhubung</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, #e5f6f4, transparent 60%), #f8fafc; color: #0f172a; font-family: "Aptos", "Trebuchet MS", sans-serif; }
      main { width: 100%; max-width: 380px; padding: 28px; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
      .mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: #0f172a; color: #fff; }
      h1 { margin: 28px 0 12px; font-size: 24px; line-height: 1.2; }
      p { margin: 0 0 24px; color: #475569; font-size: 15px; line-height: 1.6; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 12px 20px; border-radius: 12px; background: #0f766e; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #38bdf8; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">K</span>Kelilingku</div>
      <h1>Koneksi terputus</h1>
      <p>Hubungkan internet untuk melihat lokasi terbaru, chat, dan pesanan. Lokasi pedagang tidak diperbarui saat offline.</p>
      <a href="">Coba lagi</a>
    </main>
  </body>
</html>
