name: Quality And Release Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
      VITE_SERVER_URL: https://api.example.invalid
      VITE_SUPABASE_BUCKET: data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install locked backend dependencies
        run: npm ci --prefix server
      - name: Install Chromium for isolated browser tests
        run: npx playwright install --with-deps chromium
      - name: Validate code, build and isolated browser flows
        run: npm run check:release
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit backend dependencies
        run: npm audit --prefix server --omit=dev --audit-level=high
